<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">中国跨境出口的订单、交付与资金三条流向</title>
  <desc id="desc">订单由海外客户流向境内出口主体，货物或服务由境内供给方向海外客户交付，资金从海外客户经银行或支付机构流回出口主体，再支付给上游及服务商。</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20231f}
    .title{font-size:22px;font-weight:700}.label{font-size:17px;font-weight:700}.body{font-size:16px}.hint{font-size:13px;fill:#575c55}
    .box{fill:#fff;stroke:#aeb7a9;stroke-width:1.5}.lane{fill:#f5f7f3}.arrow{stroke:#475b4b;stroke-width:2.5;fill:none;marker-end:url(#tip)}
  </style>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475b4b"/></marker></defs>
  <rect width="1120" height="470" rx="12" fill="#fff"/>
  <text x="30" y="40" class="title">同一笔出口，至少有三条要对上的链路</text>

  <rect x="24" y="66" width="1072" height="112" rx="10" class="lane"/>
  <text x="42" y="96" class="label">① 订单与信息</text>
  <rect x="210" y="92" width="200" height="60" rx="8" class="box"/>
  <text x="310" y="128" class="body" text-anchor="middle">海外客户</text>
  <path d="M418 122H500" class="arrow"/>
  <rect x="515" y="92" width="200" height="60" rx="8" class="box"/>
  <text x="615" y="128" class="body" text-anchor="middle">平台／代理／销售</text>
  <path d="M723 122H805" class="arrow"/>
  <rect x="820" y="92" width="240" height="60" rx="8" class="box"/>
  <text x="940" y="128" class="body" text-anchor="middle">境内出口主体</text>

  <rect x="24" y="190" width="1072" height="112" rx="10" class="lane"/>
  <text x="42" y="220" class="label">② 货物／服务</text>
  <rect x="210" y="216" width="200" height="60" rx="8" class="box"/>
  <text x="310" y="252" class="body" text-anchor="middle">工厂／服务团队</text>
  <path d="M418 246H500" class="arrow"/>
  <rect x="515" y="216" width="200" height="60" rx="8" class="box"/>
  <text x="615" y="252" class="body" text-anchor="middle">物流／云端／现场</text>
  <path d="M723 246H805" class="arrow"/>
  <rect x="820" y="216" width="240" height="60" rx="8" class="box"/>
  <text x="940" y="252" class="body" text-anchor="middle">海外买方或最终用户</text>

  <rect x="24" y="314" width="1072" height="112" rx="10" class="lane"/>
  <text x="42" y="344" class="label">③ 资金与利润</text>
  <rect x="210" y="340" width="200" height="60" rx="8" class="box"/>
  <text x="310" y="376" class="body" text-anchor="middle">海外付款方</text>
  <path d="M418 370H500" class="arrow"/>
  <rect x="515" y="340" width="200" height="60" rx="8" class="box"/>
  <text x="615" y="376" class="body" text-anchor="middle">银行／支付机构</text>
  <path d="M723 370H805" class="arrow"/>
  <rect x="820" y="340" width="240" height="60" rx="8" class="box"/>
  <text x="940" y="365" class="body" text-anchor="middle">出口主体收款</text>
  <text x="940" y="387" class="hint" text-anchor="middle">再付供应商、税费和服务商</text>

  <text x="30" y="454" class="hint">示意图：实际主体可合并，也可分处多个国家；箭头仅表示典型方向，不代表每笔交易都经过全部节点。</text>
</svg>
