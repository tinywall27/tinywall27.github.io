<section class="archive" aria-label="文章列表">
  <div class="archive-heading">
    <p class="archive-label">AI 学习备忘 · ARCHIVE</p>
    <p class="archive-count">{{ site.posts | size }} 篇文章</p>
  </div>

  <div class="posts">
    {% for post in site.posts %}
      <article class="post-card">
        <div class="post-card__heading">
          <p class="post-card__meta">{{ post.date | date: "%Y年%-m月%-d日" }}</p>
          <h2 class="post-card__title">
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          </h2>
        </div>
        <p class="post-card__excerpt">{{ post.excerpt | strip_html | strip_newlines | truncate: 180 }}</p>
      </article>
    {% else %}
      <p class="empty-state">暂时还没有文章。</p>
    {% endfor %}
  </div>
</section>
