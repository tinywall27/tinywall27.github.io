---
layout: default
---
<article class="post-page">
  <a class="back-link" href="{{ '/' | relative_url }}">← 返回文章列表</a>

  <header class="post-header">
    <p class="post-meta">{{ page.date | date: "%Y年%-m月%-d日" }}</p>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
