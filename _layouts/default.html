<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.name }}</title>
    <link rel="stylesheet" type="text/css" href="/css/main.css?v=4191249">
    <script>
      (function () {
        try {
          var savedTheme = window.localStorage.getItem('site-theme');
          if (savedTheme === 'dark' || savedTheme === 'light') {
            document.documentElement.dataset.theme = savedTheme;
          }
        } catch (error) {}
      }());
    </script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.name }}</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到黑色模式" aria-pressed="false">黑色模式</button>
      </header>

      <main class="site-main">
        {{ content }}
      </main>
    </div>

    <script>
      (function () {
        var root = document.documentElement;
        var button = document.getElementById('theme-toggle');

        if (!button) return;

        function applyTheme(theme) {
          var isDark = theme === 'dark';
          root.dataset.theme = isDark ? 'dark' : 'light';
          button.textContent = isDark ? '白色模式' : '黑色模式';
          button.setAttribute('aria-label', isDark ? '切换到白色模式' : '切换到黑色模式');
          button.setAttribute('aria-pressed', String(isDark));
        }

        applyTheme(root.dataset.theme === 'dark' ? 'dark' : 'light');

        button.addEventListener('click', function () {
          var nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          applyTheme(nextTheme);
          try {
            window.localStorage.setItem('site-theme', nextTheme);
          } catch (error) {}
        });
      }());
    </script>
  </body>
</html>
